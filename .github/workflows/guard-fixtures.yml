name: Guard fixture smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fixtures:
    name: Universal project fixture matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Guard
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install CLI dependencies
        run: pnpm install --frozen-lockfile

      - name: Clone fixture projects
        run: pnpm test:guard:prepare-fixtures

      - name: Run Guard fixture matrix
        run: pnpm test:guard:fixtures

      - name: Run Guard mutation regression matrix
        run: pnpm test:guard:fixtures:regression
