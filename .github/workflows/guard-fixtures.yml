name: Guard fixture smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  fixtures:
    name: Universal project fixture matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Guard
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install CLI dependencies
        run: pnpm install --frozen-lockfile

      - name: Clone fixture projects
        run: pnpm test:guard:prepare-fixtures

      - name: Run Guard fixture matrix
        run: pnpm test:guard:fixtures

      - name: Run Guard mutation regression matrix
        run: pnpm test:guard:fixtures:regression
