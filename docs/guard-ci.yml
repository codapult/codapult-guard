name: Guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

concurrency:
  group: codapult-guard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: Architecture Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The base commit is required so verify can read policy from the
          # protected side of a pull request instead of trusting the PR copy.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # Do not execute lifecycle scripts supplied by untrusted PR content.
            pnpm install --frozen-lockfile --ignore-scripts
          else
            pnpm install --frozen-lockfile
          fi

      # Install @codapult/guard as a pinned dev dependency in the project first.
      # Run `codapult-guard init` once locally and commit the generated Guard memory.
      - name: Verify Guard and project checks
        env:
          POLICY_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # PR source code and package scripts are untrusted. Keep this gate
            # deterministic; trusted pushes can run the project's own checks.
            check_args=(--no-project-checks --tools off)
          else
            check_args=(--tools auto)
          fi
          if [ -n "$POLICY_BASE" ]; then
            pnpm exec codapult-guard verify "${check_args[@]}" --policy-base "$POLICY_BASE" --fail-on-policy-change --json > guard-verification.json
          else
            pnpm exec codapult-guard verify "${check_args[@]}" --json > guard-verification.json
          fi

      - name: Add Guard result to the workflow summary
        if: always() && hashFiles('guard-verification.json') != ''
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const result = JSON.parse(readFileSync('guard-verification.json', 'utf8'));
          const receipt = result.run?.receipt;
          const lines = [
            '## Codapult Guard',
            '',
            `- Result: **${result.outcome ?? 'unknown'}**`,
            `- Gate: \`${result.run?.gate ?? 'unknown'}\``,
            `- Run: \`${result.run?.runId ?? 'unknown'}\``,
          ];
          if (receipt) {
            const incompleteChecks = Object.entries(receipt.checks ?? {})
              .filter(([, check]) => check.status !== 'passed')
              .map(([name, check]) => `${name}=${check.status}`);
            const skippedStages = Object.entries(receipt.stages ?? {})
              .filter(([, status]) => status === 'skipped')
              .map(([name]) => name);
            lines.push(
              `- Commit: \`${receipt.subject.commit ?? 'unavailable'}\``,
              `- Policy fingerprint: \`${receipt.policy?.fingerprint ?? 'unavailable'}\``,
              `- Changed files: ${receipt.subject.changedFiles.length}`,
              `- Findings: ${receipt.findings.total} (${receipt.findings.errors} errors, ${receipt.findings.warnings} warnings)`,
              `- Contract issues: ${receipt.contractIssues.length}`,
              `- Guard version: \`${receipt.tool.version}\``,
            );
            if (incompleteChecks.length > 0) {
              lines.push(`- Incomplete checks: ${incompleteChecks.join(', ')}`);
            }
            if (skippedStages.length > 0) {
              lines.push(`- Skipped stages: ${skippedStages.join(', ')}`);
            }
            if (receipt.subject.baseRef) lines.push(`- Policy base: \`${receipt.subject.baseRef}\``);
          }
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `${lines.join('\n')}\n`);
          NODE

      - name: Upload verification receipt
        if: always() && hashFiles('guard-verification.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: codapult-guard-verification
          path: guard-verification.json
          if-no-files-found: ignore

      # Keep .codapult/guard policy files behind the repository's protected
      # review path. Guard applies the base policy above; CODEOWNERS or branch
      # protection decides who may approve a policy change.
      - name: Report policy files changed
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          policy_files=$(git diff --name-only "$BASE_SHA...HEAD" -- .codapult/guard)
          if [ -n "$policy_files" ]; then
            echo "Guard policy files changed; require the configured CODEOWNERS/protected review:"
            echo "$policy_files"
          fi

      - name: Prepare PR review packet
        if: github.event_name == 'pull_request'
        run: pnpm exec codapult-guard review --base "${{ github.event.pull_request.base.sha }}" --json > guard-review.json

      - name: Upload PR review packet
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: codapult-guard-review
          path: guard-review.json
          if-no-files-found: ignore

      - name: Export Guard findings as SARIF
        if: always()
        continue-on-error: true
        run: pnpm exec codapult-guard check --changed --sarif > guard-results.sarif

      - name: Upload Guard findings
        if: always() && hashFiles('guard-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: guard-results.sarif
