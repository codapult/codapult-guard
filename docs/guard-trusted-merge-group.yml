name: Guard Trusted Merge Group Verification

on:
  # This file is intended to be selected from a protected workflow repository
  # by an organization ruleset, not copied into the consuming repository.
  merge_group:
    types: [checks_requested]

permissions: {}

jobs:
  verify:
    name: Guard trusted merge-group verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate the requested merge-group identity
        id: group
        env:
          EVENT_PATH: ${{ github.event_path }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const event = JSON.parse(readFileSync(process.env.EVENT_PATH, 'utf8'));
          const group = event.merge_group;
          const isSha = (value) => typeof value === 'string' && /^[a-f0-9]{40}$/i.test(value);
          const repository = event.repository?.full_name;
          if (
            event.action !== 'checks_requested' ||
            !isSha(group?.head_sha) ||
            !isSha(group?.base_sha) ||
            group.head_sha.toLowerCase() !== process.env.EXPECTED_SHA.toLowerCase() ||
            typeof repository !== 'string' ||
            repository.toLowerCase() !== process.env.EXPECTED_REPOSITORY.toLowerCase()
          ) {
            throw new Error('Merge-group event, repository, head SHA, or base SHA is missing or inconsistent.');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `head_sha=${group.head_sha}\nbase_sha=${group.base_sha}\n`);
          NODE

      - name: Check out the exact merge-group candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ steps.group.outputs.head_sha }}
          fetch-depth: 0

      - name: Verify the candidate checkout and fetch the exact queue base
        env:
          HEAD_SHA: ${{ steps.group.outputs.head_sha }}
          BASE_SHA: ${{ steps.group.outputs.base_sha }}
        run: |
          actual_head=$(git rev-parse HEAD)
          if [ "$actual_head" != "$HEAD_SHA" ] || [ "$GITHUB_SHA" != "$HEAD_SHA" ]; then
            echo "Checked out $actual_head; expected merge-group head $HEAD_SHA (GITHUB_SHA=$GITHUB_SHA)." >&2
            exit 1
          fi
          git fetch --no-tags origin "$BASE_SHA"
          if ! git cat-file -e "$BASE_SHA^{commit}"; then
            echo "Merge-group base commit $BASE_SHA is unavailable." >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Fetch the pinned Guard source revision
        working-directory: ${{ runner.temp }}
        env:
          GUARD_VERSION: ${{ vars.CODAPULT_GUARD_VERSION }}
          GUARD_COMMIT: ${{ vars.CODAPULT_GUARD_COMMIT }}
        run: |
          if ! [[ "$GUARD_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Set CODAPULT_GUARD_VERSION to an exact Guard release version." >&2
            exit 1
          fi
          if ! [[ "$GUARD_COMMIT" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Set CODAPULT_GUARD_COMMIT to the full 40-character commit SHA for that Guard release tag." >&2
            exit 1
          fi
          git init codapult-guard-source
          git -C codapult-guard-source remote add origin https://github.com/codapult/codapult-guard.git
          git -C codapult-guard-source fetch --depth=1 origin "refs/tags/v$GUARD_VERSION:refs/tags/guard-release"
          fetched_commit=$(git -C codapult-guard-source rev-parse 'refs/tags/guard-release^{commit}')
          if [ "$fetched_commit" != "$GUARD_COMMIT" ]; then
            echo "Guard release tag resolved to $fetched_commit, expected $GUARD_COMMIT." >&2
            exit 1
          fi
          git -C codapult-guard-source checkout --detach "$GUARD_COMMIT"
          if [ "$(node -p "require('./codapult-guard-source/package.json').version")" != "$GUARD_VERSION" ]; then
            echo "Guard source package version does not match CODAPULT_GUARD_VERSION." >&2
            exit 1
          fi

      - name: Build pinned Guard with its frozen dependency graph
        working-directory: ${{ runner.temp }}/codapult-guard-source
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile --ignore-scripts
          corepack pnpm --filter @codapult/guard build

      - name: Verify the merge-group candidate with queue-base policy
        env:
          BASE_SHA: ${{ steps.group.outputs.base_sha }}
          GUARD_POLICY_MODE: ${{ vars.CODAPULT_GUARD_POLICY_MODE || 'strict' }}
          GUARD_RESULT_FILE: ${{ runner.temp }}/guard-merge-group-verification.json
        run: |
          check_args=(--no-project-checks --tools off)
          case "$GUARD_POLICY_MODE" in
            host-review)
              ;;
            strict)
              check_args+=(--fail-on-policy-change --fail-on-protected-changes)
              ;;
            *)
              echo "Unsupported CODAPULT_GUARD_POLICY_MODE: $GUARD_POLICY_MODE (expected host-review or strict)." >&2
              exit 2
              ;;
          esac
          node "$RUNNER_TEMP/codapult-guard-source/dist/cli/index.js" verify \
            "${check_args[@]}" \
            --policy-base "$BASE_SHA" \
            --json \
            > "$GUARD_RESULT_FILE"

      - name: Confirm the Guard receipt matches this merge group
        env:
          BASE_SHA: ${{ steps.group.outputs.base_sha }}
          HEAD_SHA: ${{ steps.group.outputs.head_sha }}
          GUARD_POLICY_MODE: ${{ vars.CODAPULT_GUARD_POLICY_MODE || 'strict' }}
          GUARD_RESULT_FILE: ${{ runner.temp }}/guard-merge-group-verification.json
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const result = JSON.parse(readFileSync(process.env.GUARD_RESULT_FILE, 'utf8'));
          const receipt = result.run?.receipt;
          const scope = receipt?.verificationScope;
          if (result.outcome !== 'pass' || receipt?.outcome !== 'pass') throw new Error('Guard did not pass.');
          if (receipt.version !== 1 || receipt.kind !== 'verification-receipt' || typeof receipt.runId !== 'string' || receipt.runId.length === 0) {
            throw new Error('Guard receipt has an unsupported schema or no run ID.');
          }
          if (
            receipt.subject?.githubEvent !== 'merge_group' ||
            receipt.subject?.headSha !== undefined ||
            receipt.subject?.mergeSha !== process.env.HEAD_SHA ||
            receipt.subject?.baseSha !== process.env.BASE_SHA
          ) {
            throw new Error('Guard receipt does not match the triggering merge-group head and base SHAs.');
          }
          if (receipt.policy?.source !== 'git-ref' || receipt.policy?.ref !== process.env.BASE_SHA) {
            throw new Error('Guard did not use the exact queue-base policy revision.');
          }
          if (scope?.algorithm !== 'sha256' || scope.complete !== true || scope.stable !== true || !/^[a-f0-9]{64}$/.test(scope.fingerprint ?? '')) {
            throw new Error('Guard receipt has no complete, stable verification scope.');
          }
          const surface = receipt.policySurface;
          if (
            !surface ||
            surface.complete !== true ||
            typeof surface.workflowChanged !== 'boolean' ||
            !Array.isArray(surface.changedPaths) ||
            !surface.changedPaths.every((path) => typeof path === 'string') ||
            !Array.isArray(surface.suppressionMarkers) ||
            !surface.suppressionMarkers.every((marker) => typeof marker === 'string')
          ) {
            throw new Error('Guard did not completely inspect the policy surface against the queue base.');
          }
          const ciIntegrity = receipt.ciIntegrity;
          if (!ciIntegrity || ciIntegrity.status !== 'ok' || !Array.isArray(ciIntegrity.workflows)) {
            throw new Error('Guard requires a complete, passing GitHub Actions integrity contract.');
          }
          const policySensitive =
            receipt.policy.changedFromBase === true ||
            surface.changedPaths.length > 0 ||
            surface.workflowChanged === true ||
            surface.suppressionMarkers.length > 0;
          if (policySensitive && process.env.GUARD_POLICY_MODE === 'strict') {
            throw new Error('Strict policy mode passed a policy-sensitive merge group unexpectedly.');
          }
          NODE

      - name: Summarize the merge-group verification
        if: always()
        env:
          GUARD_RESULT_FILE: ${{ runner.temp }}/guard-merge-group-verification.json
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, existsSync, readFileSync, statSync } from 'node:fs';
          const path = process.env.GUARD_RESULT_FILE;
          if (!path || !existsSync(path) || statSync(path).size === 0) {
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## Guard trusted merge-group verification\n\n- Result: **incomplete** (no Guard result was produced).\n');
            process.exit(0);
          }
          let result;
          try {
            result = JSON.parse(readFileSync(path, 'utf8'));
          } catch {
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## Guard trusted merge-group verification\n\n- Result: **incomplete** (Guard result was not valid JSON).\n');
            process.exit(0);
          }
          const receipt = result.run?.receipt;
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '## Guard trusted merge-group verification',
            '',
            `- Guard verdict: **${result.outcome ?? 'unknown'}**`,
            `- Merge-group SHA: \`${receipt?.subject?.mergeSha ?? 'unavailable'}\``,
            `- Queue base SHA: \`${receipt?.subject?.baseSha ?? 'unavailable'}\``,
            `- Policy fingerprint: \`${receipt?.policy?.fingerprint ?? 'unavailable'}\``,
            `- Guard version: \`${receipt?.tool?.version ?? 'unavailable'}\``,
            '- This result covers the aggregate merge-group candidate; it does not represent a single PR head.',
            '',
          ].join('\n'));
          NODE

      - name: Upload the merge-group verification receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guard-merge-group-verification
          path: ${{ runner.temp }}/guard-merge-group-verification.json
          if-no-files-found: ignore
